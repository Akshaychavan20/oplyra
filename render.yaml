services:
  - type: web
    name: oplyra-platform
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///instance/oplyra.db
      - key: GEMINI_API_KEY
        sync: false
