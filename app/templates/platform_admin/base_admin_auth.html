<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Oplyra Internal Admin{% endblock %}</title>
    {% include 'partials/_head_brand.html' %}
    <script>
        (function() {
            var stored = localStorage.getItem('theme-mode');
            var preference = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'dark';
            var effective = preference === 'system'
                ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
                : preference;
            document.documentElement.setAttribute('data-theme', effective);
            document.documentElement.style.colorScheme = effective;
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/platform-admin.css') }}">
</head>
<body class="pa-body pa-auth-body">
    {% from 'partials/_logo.html' import oplyra_logo, oplyra_logo_defs %}
    {{ oplyra_logo_defs() }}
    <div class="pa-auth-shell">
        <div class="pa-topbar-meta" style="position:absolute;top:1rem;right:1rem;">
            <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                <span class="theme-toggle-track" aria-hidden="true">
                    <i class="bi bi-sun-fill theme-icon-sun"></i>
                    <i class="bi bi-moon-stars-fill theme-icon-moon"></i>
                </span>
            </button>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
